name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zagros
          POSTGRES_PASSWORD: zagros_ci_password
          POSTGRES_DB: zagros_repost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zagros -d zagros_repost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zagros:zagros_ci_password@localhost:5432/zagros_repost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type-check (lint)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
